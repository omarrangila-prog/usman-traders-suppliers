<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c1121f">
<title>Field Booking — Usman Traders</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
:root{--brand:#c1121f;--brand-2:#e03131;--ink:#17191c;--ink-2:#454b54;--ink-3:#7b838e;
  --line:#e6e9ee;--bg:#f6f7f9;--surface:#fff;--green:#0b7a45;--green-bg:#e4f6ec;
  --amber:#a35c00;--amber-bg:#fef3e2;--radius:12px;}
*{box-sizing:border-box;}
html,body{margin:0;font-family:"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);
  color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;}
.hidden{display:none !important;}

header{position:sticky;top:0;z-index:10;
  background:linear-gradient(160deg,var(--brand-2),var(--brand));color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:11px;}
header img{width:38px;height:38px;border-radius:9px;background:#fff;padding:2px;}
header .t{flex:1;min-width:0;}
header strong{display:block;font-size:15px;}
header span{font-size:11.5px;opacity:.9;}

.net{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.18);padding:5px 9px;border-radius:20px;white-space:nowrap;}
.net .dot{width:7px;height:7px;border-radius:50%;background:#8ef0b4;}
.net.off .dot{background:#ffd0a0;}

.bar{background:var(--amber-bg);color:var(--amber);padding:9px 16px;font-size:12.5px;
  font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.bar button{border:1px solid #e2c48c;background:#fff;color:var(--amber);
  border-radius:7px;padding:5px 11px;font-size:12px;font-weight:700;}

main{padding:14px;padding-bottom:calc(96px + env(safe-area-inset-bottom));}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:13px;box-shadow:0 1px 2px rgba(16,24,40,.05);}
h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);}

label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:12px;}
input,select,textarea{width:100%;padding:12px;border:1px solid #dde2e8;border-radius:9px;
  font-size:16px;font-family:inherit;margin-top:5px;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);
  box-shadow:0 0 0 3px #fbe0e1;}
textarea{min-height:64px;resize:vertical;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.seg{display:flex;gap:8px;margin-bottom:14px;}
.seg button{flex:1;padding:12px;border:1px solid var(--line);background:#fff;
  border-radius:10px;font-size:14px;font-weight:700;color:var(--ink-2);font-family:inherit;}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;}

.line{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px;
  background:#fbfcfd;position:relative;}
.line .rm{position:absolute;top:6px;right:8px;border:0;background:none;font-size:20px;
  color:var(--ink-3);line-height:1;padding:2px 6px;}
.line .amt{text-align:right;font-weight:700;font-size:13px;margin-top:8px;
  padding-top:8px;border-top:1px solid var(--line);}
.add{width:100%;padding:12px;border:1px dashed #c8d0d9;background:#fff;border-radius:10px;
  font-weight:700;color:var(--ink-2);font-family:inherit;font-size:14px;}

.total{display:flex;justify-content:space-between;align-items:center;
  font-size:19px;font-weight:800;padding-top:12px;margin-top:4px;border-top:2px solid var(--ink);}

.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:10;}
.foot button{flex:1;padding:15px;border-radius:11px;font-size:15px;font-weight:700;
  border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;}
.foot .save{background:linear-gradient(180deg,var(--brand-2),var(--brand));
  border-color:var(--brand);color:#fff;}

.queue{font-size:12.5px;color:var(--ink-3);}
.qrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;
  border-bottom:1px solid #f1f3f6;font-size:13px;}
.qrow:last-child{border-bottom:0;}
.pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.pill.wait{background:var(--amber-bg);color:var(--amber);}
.pill.done{background:var(--green-bg);color:var(--green);}

.toast{position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:13px 16px;border-radius:11px;font-size:13.5px;
  z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.3);}
.toast.ok{background:#12995a;}
.toast.err{background:var(--brand);}
</style>
</head>
<body>

<header>
  <img src="/logo.png" alt="">
  <div class="t">
    <strong>Field Booking</strong>
    <span id="company">Usman Traders &amp; Suppliers</span>
  </div>
  <div class="net" id="net"><span class="dot"></span><span id="net-text">Online</span></div>
</header>

<div class="bar hidden" id="pending-bar">
  <span id="pending-text">0 waiting to sync</span>
  <button id="sync-now">Sync now</button>
</div>

<main>
  <div class="seg">
    <button class="on" data-kind="Booking">Customer Booking</button>
    <button data-kind="Purchase">Purchase</button>
  </div>

  <div class="card">
    <h2 id="party-heading">Shop / customer</h2>
    <label>Name *<input id="party" list="party-list" placeholder="Shop or customer name" autocomplete="off"></label>
    <datalist id="party-list"></datalist>
    <div class="two">
      <label>Phone<input id="phone" type="tel" inputmode="tel" placeholder="0300-1234567"></label>
      <label>City<input id="city" placeholder="Karachi"></label>
    </div>
    <label>Date<input id="date" type="date"></label>
  </div>

  <div class="card">
    <h2>Items</h2>
    <div id="lines"></div>
    <button class="add" id="add-line">+ Add item</button>
    <div class="total"><span>Total</span><span id="total">PKR 0.00</span></div>
  </div>

  <div class="card">
    <h2>Note</h2>
    <textarea id="notes" placeholder="Anything worth remembering about this visit"></textarea>
  </div>

  <div class="card">
    <h2>Saved on this phone</h2>
    <div id="queue" class="queue">Nothing saved yet.</div>
  </div>
</main>

<div class="foot">
  <button id="clear">Clear</button>
  <button class="save" id="save">Save booking</button>
</div>

<script src="/field.js"></script>
</body>
</html>
