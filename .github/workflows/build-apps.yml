name: Build Windows app

# PyInstaller does not cross-compile, so the program is built on Windows here.
# It is started and asked for /api/health before publishing, so a build that
# produces a file which cannot run never ships.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyinstaller==6.11.1

      - name: Build
        shell: bash
        run: |
          # A console window is deliberate. Without it the program shows nothing
          # at all for the ten seconds it takes to unpack itself, which reads as
          # failure - people double-click again and end up with two copies.
          pyinstaller --onefile --name UsmanTraders \
            --icon static/icon.ico \
            --add-data "static;static" \
            --hidden-import app --hidden-import db --hidden-import xlsx \
            --hidden-import appwrite_client \
            desktop.py

      - name: Does it actually run?
        shell: bash
        run: |
          test -f dist/UsmanTraders.exe || { echo "no program produced"; exit 1; }
          ls -l dist/UsmanTraders.exe
          export UT_NO_WINDOW=1 UT_LOGIN=off
          ./dist/UsmanTraders.exe > out.log 2>&1 &
          for i in $(seq 1 40); do
            for port in 8000 8001 8002 8003; do
              if curl -fsS --max-time 3 "http://127.0.0.1:$port/api/health" 2>/dev/null; then
                echo ""; echo "served on port $port"; exit 0
              fi
            done
            sleep 2
          done
          echo "--- output ---"; cat out.log || true
          find . -name startup-error.log -exec cat {} \; || true
          echo "it started but never served the app"; exit 1

      - name: Check it runs from a read-only folder, as it would from a zip
        shell: bash
        run: |
          mkdir -p locked && cp dist/UsmanTraders.exe locked/
          powershell -Command "$acl = Get-Acl locked; \
            $rule = New-Object System.Security.AccessControl.FileSystemAccessRule( \
              [System.Security.Principal.WindowsIdentity]::GetCurrent().Name, \
              'Write','Deny'); $acl.AddAccessRule($rule); Set-Acl locked $acl" || true
          export UT_NO_WINDOW=1 UT_LOGIN=off
          ./locked/UsmanTraders.exe > locked.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            for port in 8000 8001 8002 8003; do
              if curl -fsS --max-time 3 "http://127.0.0.1:$port/api/health" >/dev/null 2>&1; then
                echo "still serves when its own folder cannot be written to"; ok=1; break 2
              fi
            done
            sleep 2
          done
          [ "$ok" = "1" ] || { cat locked.log || true; echo "failed from a read-only folder"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: UsmanTraders-windows
          path: dist/UsmanTraders.exe
          retention-days: 90
